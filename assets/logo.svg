<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0E1524"/>
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Stroke Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Violet Stroke Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Pillar Gradient -->
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#centerGlow)"/>

  <!-- Modal Outer Box Frame (Unicode-style Border) -->
  <rect x="88" y="88" width="336" height="336" rx="28" fill="#0D1321" fill-opacity="0.75" stroke="#1E293B" stroke-width="3"/>

  <!-- Four Unicode Box Frame Corners (╭─╮ ╰─╯) -->
  <!-- Top Left Corner -->
  <path d="M 88 152 L 88 116 Q 88 88 116 88 L 152 88" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round"/>
  <!-- Top Right Corner -->
  <path d="M 360 88 L 396 88 Q 424 88 424 116 L 424 152" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round"/>
  <!-- Bottom Left Corner -->
  <path d="M 88 360 L 88 396 Q 88 424 116 424 L 152 424" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round"/>
  <!-- Bottom Right Corner -->
  <path d="M 360 424 L 396 424 Q 424 424 424 396 L 424 360" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Terminal Header Divider Line & Controls -->
  <line x1="88" y1="140" x2="424" y2="140" stroke="#1E293B" stroke-width="2"/>
  <circle cx="122" cy="114" r="5" fill="#EF4444" fill-opacity="0.85"/>
  <circle cx="140" cy="114" r="5" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="158" cy="114" r="5" fill="#10B981" fill-opacity="0.85"/>

  <!-- Terminal Title: [ modalx ] -->
  <text x="256" y="119" fill="#64748B" font-family="JetBrains Mono, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">[ modalx ]</text>

  <!-- Central Monogram: The "M" and "X" Symbiosis -->
  <g filter="url(#neonGlow)">
    <!-- X Crossing Stroke: Ascending (Bottom-Left to Top-Right) -->
    <line x1="168" y1="344" x2="344" y2="196" stroke="url(#violetGrad)" stroke-width="24" stroke-linecap="round"/>

    <!-- X & M Main Stroke: Descending (Top-Left to Bottom-Right) -->
    <line x1="168" y1="196" x2="344" y2="344" stroke="url(#cyanGrad)" stroke-width="24" stroke-linecap="round"/>

    <!-- Left Pillar of M -->
    <line x1="168" y1="196" x2="168" y2="344" stroke="url(#pillarGrad)" stroke-width="24" stroke-linecap="round"/>

    <!-- Right Pillar of M -->
    <line x1="344" y1="196" x2="344" y2="344" stroke="url(#pillarGrad)" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- Terminal Active Cursor Prompt at Bottom -->
  <rect x="168" y="372" width="22" height="6" rx="3" fill="#38BDF8"/>
  <circle cx="206" cy="375" r="3" fill="#10B981"/>
</svg>
