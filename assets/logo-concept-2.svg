<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="modalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#06B6D4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg2)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Background Terminal Window (Dimmed / De-focused) -->
  <g opacity="0.35">
    <rect x="64" y="64" width="384" height="384" rx="24" fill="#090D16" stroke="#334155" stroke-width="2"/>
    <line x1="64" y1="108" x2="448" y2="108" stroke="#334155" stroke-width="1.5"/>
    <!-- Terminal grid lines representing background shell buffer -->
    <line x1="96" y1="140" x2="220" y2="140" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <line x1="96" y1="164" x2="320" y2="164" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="96" y1="188" x2="180" y2="188" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="96" y1="212" x2="260" y2="212" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Elevated Active Modal Card (Floating with Glow) -->
  <g filter="url(#cardShadow)">
    <rect x="116" y="116" width="280" height="280" rx="20" fill="url(#modalBg)" stroke="#38BDF8" stroke-width="2.5"/>

    <!-- Modal Header -->
    <rect x="116" y="116" width="280" height="42" rx="20" fill="#0F172A"/>
    <rect x="116" y="138" width="280" height="20" fill="#0F172A"/>
    <line x1="116" y1="158" x2="396" y2="158" stroke="#334155" stroke-width="1.5"/>

    <!-- Modal Title Badge -->
    <text x="256" y="143" fill="#E2E8F0" font-family="JetBrains Mono, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">MODAL DIALOG</text>

    <!-- Modal Box Geometry: 4 Precision Corner Crosshairs -->
    <!-- Top-Left -->
    <path d="M 132 178 L 132 168 L 142 168" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>
    <!-- Top-Right -->
    <path d="M 380 178 L 380 168 L 370 168" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>
    <!-- Bottom-Left -->
    <path d="M 132 366 L 132 376 L 142 376" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>
    <!-- Bottom-Right -->
    <path d="M 380 366 L 380 376 L 370 376" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>

    <!-- The Geometric 'X' Symbol with Prompt Arrow -->
    <g transform="translate(256, 268)">
      <!-- Left Chevron '>' that forms the left side of X -->
      <path d="M -50 -44 L -10 0 L -50 44" fill="none" stroke="url(#neonEmerald)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Right Chevron '<' that forms the right side of X -->
      <path d="M 50 -44 L 10 0 L 50 44" fill="none" stroke="url(#neonCyan)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Center Intersection Spark / Dot -->
      <circle cx="0" cy="0" r="6" fill="#F8FAFC"/>
    </g>

    <!-- Bottom Action Button Row in Modal -->
    <rect x="180" y="344" width="70" height="24" rx="6" fill="#0284C7"/>
    <text x="215" y="360" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Confirm</text>

    <rect x="262" y="344" width="70" height="24" rx="6" fill="#334155"/>
    <text x="297" y="360" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Cancel</text>
  </g>
</svg>
