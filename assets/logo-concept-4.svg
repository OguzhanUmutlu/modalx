<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080F"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <linearGradient id="keycapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <filter id="bracketShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg4)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Keycap / Button Base -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="url(#keycapGrad)" stroke="#334155" stroke-width="3"/>
  <rect x="88" y="88" width="336" height="336" rx="28" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Left Bracket: [ -->
  <path d="M 160 156 L 126 156 L 126 356 L 160 356" fill="none" stroke="#94A3B8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Bracket: ] -->
  <path d="M 352 156 L 386 156 L 386 356 L 352 356" fill="none" stroke="#94A3B8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center 'M X' Ligature Glyph -->
  <g filter="url(#bracketShadow)">
    <!-- Central 'X' Cross -->
    <line x1="200" y1="200" x2="312" y2="312" stroke="url(#textGrad)" stroke-width="20" stroke-linecap="round"/>
    <line x1="200" y1="312" x2="312" y2="200" stroke="url(#textGrad)" stroke-width="20" stroke-linecap="round"/>

    <!-- Left Vertical Line connecting to X center forming M -->
    <line x1="200" y1="200" x2="200" y2="312" stroke="#F8FAFC" stroke-width="20" stroke-linecap="round"/>
    <!-- Right Vertical Line connecting to X center forming M -->
    <line x1="312" y1="200" x2="312" y2="312" stroke="#F8FAFC" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- Monospace Subtext: modalx -->
  <text x="256" y="394" fill="#64748B" font-family="JetBrains Mono, Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="4">MODALX</text>
</svg>
