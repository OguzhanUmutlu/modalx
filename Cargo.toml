[package]
name = "modalx"
version = "0.1.2"
edition = "2021"
authors = ["OguzhanUmutlu"]
license = "MIT"
repository = "https://github.com/OguzhanUmutlu/modalx"
homepage = "https://modalx.oguzhanumutlu.com"
documentation = "https://docs.rs/modalx"
description = "A polished, modal-driven terminal UI framework for Rust featuring dynamic boxed frames, interactive forms, and context-aware shortcuts."
readme = "README.md"
keywords = ["tui", "terminal", "modal", "crossterm", "cli"]
categories = ["command-line-interface", "command-line-utilities"]

[dependencies]
crossterm = "0.29"
colored = "3.0"
thiserror = "2.0"
unicode-width = "0.2"
